version: '3.8'

services:
  # ==========================================
  # DATABASE SERVICE (POSTGRESQL)
  # SERVICIO DE BASE DE DATOS (POSTGRESQL)
  # ==========================================
  db:
    image: postgres:15-alpine
    container_name: latiendita-db
    environment:
      POSTGRES_DB: latiendita
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the schema inside the container so you can execute it manually later
      # Montar el esquema dentro del contenedor para que puedas ejecutarlo manualmente luego
      - ./postgres_schema.sql:/opt/postgres_schema.sql:ro
    restart: always

  # ==========================================
  # GO BACKEND API SERVICE (DEVELOPMENT MODE WITH AIR)
  # SERVICIO API DEL BACKEND GO (MODO DESARROLLO CON AIR)
  # ==========================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: latiendita-api
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    environment:
      PORT: 8080
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      DB_NAME: latiendita
      DB_SSLMODE: disable
    depends_on:
      - db
    restart: on-failure

volumes:
  postgres_data:
